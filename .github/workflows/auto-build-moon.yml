name: Auto Build ReSukiSU for Moon

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force trigger kernel build"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: auto-build-resukisu-moon
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://github.com/zzh20188/GKI_KernelSU_SUSFS.git
  UPSTREAM_BRANCH: dev
  TARGET_BRANCH: dev
  STATE_FILE: .github/.last-upstream-sync
  KEEP_PATHS: ".github config/config config/stock_defconfig"

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add and fetch upstream
        run: |
          set -euo pipefail
          if ! git remote get-url upstream >/dev/null 2>&1; then
            git remote add upstream "${UPSTREAM_REPO}"
          fi
          git fetch upstream "${UPSTREAM_BRANCH}"

      - name: Check for new upstream commits
        id: check
        run: |
          set -euo pipefail
          REMOTE=$(git rev-parse "upstream/${UPSTREAM_BRANCH}")

          if [ -f "${STATE_FILE}" ]; then
            LAST_SYNCED=$(cat "${STATE_FILE}")
          else
            LAST_SYNCED=""
          fi

          echo "Last synced upstream commit: ${LAST_SYNCED:-<none>}"
          echo "Remote (upstream/${UPSTREAM_BRANCH}):  ${REMOTE}"

          if [ "${REMOTE}" != "${LAST_SYNCED}" ]; then
            echo "has_update=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_update=false" >> "$GITHUB_OUTPUT"
          fi
          echo "remote_sha=${REMOTE}" >> "$GITHUB_OUTPUT"

          FORCE="${{ github.event.inputs.force_build }}"
          echo "force_build=${FORCE:-false}" >> "$GITHUB_OUTPUT"

      - name: Sync content with upstream
        if: steps.check.outputs.has_update == 'true'
        run: |
          set -euo pipefail

          git checkout "upstream/${UPSTREAM_BRANCH}" -- . ':!.github' ':!config/config' ':!config/stock_defconfig'
          git clean -fd -e .github -e config/config -e config/stock_defconfig

          mkdir -p "$(dirname "${STATE_FILE}")"
          echo "${{ steps.check.outputs.remote_sha }}" > "${STATE_FILE}"

          git add -A

          if git diff --cached --quiet; then
            echo "No content changes after excluding: ${KEEP_PATHS}"
          else
            git commit -m "chore: sync with upstream/${UPSTREAM_BRANCH} ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi

      - name: Trigger kernel build
        if: steps.check.outputs.has_update == 'true' || steps.check.outputs.force_build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run kernel-custom.yml \
            --repo "${{ github.repository }}" \
            --ref "${TARGET_BRANCH}" \
            -f kernel_version="6.6" \
            -f os_patch_level="2025-06" \
            -f kernelsu_variant="ReSukiSU" \
            -f use_kpm="disabled (关闭)" \
            -f artifact_upload_mode="上传全部" \
            -f use_zram=true \
            -f use_bbg=true \
            -f use_rekernel=true \
            -f cve_2026_43499_patch=true \
            -f cancel_susfs=false \
            -f supp_op=false \
            -f droidspaces="off" \
            -f droidspaces_ntsync=false

      - name: Summary
        if: always()
        run: |
          {
            echo "### Auto Build ReSukiSU for Moon"
            echo "- Upstream: \`${UPSTREAM_REPO}\` (\`${UPSTREAM_BRANCH}\`)"
            echo "- Target branch: \`${TARGET_BRANCH}\`"
            echo "- Kept local (not overwritten): \`${KEEP_PATHS}\`"
            echo "- Has update: \`${{ steps.check.outputs.has_update }}\`"
            echo "- Force build: \`${{ steps.check.outputs.force_build }}\`"
          } >> "$GITHUB_STEP_SUMMARY"